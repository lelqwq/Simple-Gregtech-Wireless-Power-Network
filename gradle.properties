# ExampleMod 的标签，用作 Blowdryer（Spotless 等）设置版本，留空则禁用。
# LOCAL 用于测试本地配置更新。
gtnh.settings.blowdryerTag = 0.2.2

# 若设置，RetroFutura/GTNH 构建逻辑将使用此发布版本号，而不是从 git 推导。
# 设置为语义化版本号（如 0.0.1）可强制 Tags.VERSION 为该值。
RELEASE_VERSION = 0.5.0

# 人类可读的模组名称，用于填充 mcmod.info。
modName = GTSimpleWirelessNetwork

# 区分大小写的标识符，用于填充 mcmod.info，并用于自动生成 mixin JSON。
# 惯例为小写。
modId = gtswn

# 模组的根包名，用于在其他属性中查找各种类、
# mcmod.info 替换、在 run 任务中启用断言等。
modGroup = com.miaokatze.gtswn

# 是否使用 modGroup 作为 Maven 发布的 group。
# 为 false 时使用 com.github.GTNewHorizons。
useModGroupForPublishing = true

# 有可用更新时自动更新你的 build.gradle 和 settings.gradle。
autoUpdateBuildScript = false

# 目标 Minecraft 版本
minecraftVersion = 1.7.10

# 目标 Minecraft Forge 版本
forgeVersion = 10.13.4.1614

# 指定依赖反混淆和 deobfParams 任务所用的 MCP 通道。
channel = stable

# 指定依赖反混淆和 deobfParams 任务所用的 MCP 映射版本。
mappingsVersion = 12

# 定义其他用于依赖反混淆的 MCP 映射。
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

# 选择测试模组时的默认用户名。可以每次运行覆盖，例如执行
# `./gradlew runClient --username=AnotherPlayer`，或在 IDE 中配置此命令。
developmentEnvironmentUserName = Developer

# 启用现代 Java 语法支持。合法值：
# - false: 无现代语法，仅 Java 8
# - jabel: Jabel 仅语法支持，编译为 J8 字节码
# - jvmDowngrader: 通过 JVM Downgrader 完整支持现代 Java（语法 + 标准库 API）
# - modern: 原生现代 Java 字节码，不降级
enableModernJavaSyntax = jabel

# 若设置，将忽略上述设置并使用给定工具链编译。这可能会导致意外问题，
# 大多数情况下*不应*使用。-1 禁用此项。
# forceToolchainVersion = -1

# JVM Downgrader 字节码降级的目标 JVM 版本。
# 仅在 enableModernJavaSyntax = jvmDowngrader 时使用
# downgradeTargetVersion = 8

# 多版本 jar 支持的 Java 版本逗号分隔列表（仅 JVM Downgrader）。
# 类将放入 META-INF/versions/N/ 中，列表中的每个版本 N 对应一份。
# 默认: "21,25"（J25+ 获得原生类，J21-24 获得部分降级，J8-20 获得完整降级）。
# jvmDowngraderMultiReleaseVersions = 21,25

# 指定 JVM Downgrader API 存根的提供方式。选项：
# - shade: 将最小化存根打包进 jar
# - gtnhlib: 由 GTNHLib 在运行时提供存根（会添加版本约束）
# - external: 由另一个依赖提供存根（无约束，无警告）
# - (空): 警告提醒你配置存根
# 注意: 'shade' 选项要求你验证许可证合规性，参见: https://github.com/unimined/JvmDowngrader/blob/main/LICENSE.md
# jvmDowngraderStubsProvider =

# 启用向反编译源码注入缺失的泛型，以获得更好的编码体验。
# 将大多数公开可见的 List、Map 等转换为合适的 List<E>、Map<K, V> 类型。
enableGenericInjection = true

# 生成一个类，其中包含如下定义的模组版本 String 字段。
# 若 generateGradleTokenClass 为空或未设置，则不生成此类。
# 若 gradleTokenVersion 为空或未设置，则类中不存在该字段。
generateGradleTokenClass = com.miaokatze.gtswn.Tags

# 要生成/替换的、包含项目当前版本的 token 名称。
gradleTokenVersion = VERSION

# [已废弃]
# 可在此定义多个源文件，提供逗号分隔列表: Class1.java,Class2.java,Class3.java
# public static final String VERSION = "GRADLETOKEN_VERSION";
# 编译时该字符串内容将被替换为你的模组版本。你应该用它在
# @Mod([...], version = VERSION, [...]) 中指定模组版本。
# 将这些属性留空以跳过单独的 token 替换。
replaceGradleTokenInFile =

# 如果你的模组提供了供其他模组实现的 API，可在此声明其包名。否则可
# 将此属性留空。
# 示例值: (apiPackage = api) + (modGroup = com.myname.mymodid) -> com.myname.mymodid.api
apiPackage =

# 在此指定 Forge 访问转换器的配置文件。它必须放在 /src/main/resources/META-INF/ 中。
# 可以有多个文件，以空格分隔列表。
# 示例值: mymodid_at.cfg nei_at.cfg
accessTransformersFile =

# 若启用则提供 Mixin 设置。如果你不知道 mixin 是什么：保持禁用！
# 注意: 即使你的模组不使用 mixin，GTNHLib 等依赖也可能需要 mixin 环境。
usesMixins = false

# 设置为非空字符串，可在 src/VALUE 下（而非 src/main）的单独源码集中配置 mixin。
# 这可以加快编译速度，因为不需要在所有输入源上运行 mixin 注解处理器。
# Mixin 类可以访问 "main" 类，反之则不行。
separateMixinSourceSet =

# 添加一些调试参数，如详细输出和类导出。
usesMixinDebug = false

# 指定你的 IMixinConfigPlugin 实现位置。否则留空。
mixinPlugin =

# 指定包含所有 Mixin 的包。该包必须存在，否则
# 构建将失败。如果你的 mixins.<modid>.json 中定义了 package 属性，
# 它必须与此一致，否则构建将失败。
mixinsPackage =

# 如果使用核心模组，指定核心模组入口类。该类必须实现 IFMLLoadingPlugin！
# 此参数仅用于旧版兼容
# 示例值: (coreModClass = asm.FMLPlugin) + (modGroup = com.myname.mymodid) -> com.myname.mymodid.asm.FMLPlugin
coreModClass =

# 如果你的项目仅是 mixin 或核心模组的整合体，且不包含"普通"模组（= 某个
# 带有 @Mod 注解的类），请将此设为 true。拿不准时保持 false！
containsMixinsAndOrCoreModOnly = false

# 即使本模组不使用 Mixin 也启用 Mixin，当某个依赖使用 mixin 时有用。
forceEnableMixins = false

# 若启用，你可以对依赖使用 'shadowCompile'。它们将被整合进你的 jar。你有
# 责任检查许可证，并在需要时请求分发许可。
usesShadowedDependencies = false

# 若禁用，将不移除影子依赖中未使用的类。一些库使用反射访问
# 自己的类，使得最小化不可靠。
minimizeShadowedDependencies = true

# 若禁用，将不重命名影子类。
relocateShadowedDependencies = true

# 添加 CurseMaven、Modrinth 以及一些更知名的 1.7.10 仓库。
includeWellKnownRepositories = true

# 要从 includeWellKnownRepositories 设置中排除的仓库列表。应为空格分隔的
# 字符串列表，可接受的键为（大小写不敏感）:
# cursemaven
# modrinth
excludeWellKnownRepositories =

# 如果想发布到自定义 Maven 仓库（而非默认的 GTNH Maven），请将此处改为你的 Maven 坐标。
# 使用 MAVEN_USER 和 MAVEN_PASSWORD 环境变量进行身份验证。
# 如果需要更复杂的设置，请在此禁用 maven 发布，并在 addon.gradle 中添加发布仓库。
usesMavenPublishing = true

# 模组发布到的 Maven 仓库。
# mavenPublishUrl = https\://nexus.gtnewhorizons.com/repository/releases/

# 发布到 Modrinth 需要将 MODRINTH_TOKEN 环境变量设置为你的当前 Modrinth API token。
#
# 项目在 Modrinth 上的 ID。可以是 slug 或 ID。
# 如果不想发布到 Modrinth，请留空。
modrinthProjectId =

# 项目在 Modrinth 上的关系。可以用它引用 Modrinth 上的其他项目。
# 语法: scope1-type1:name1;scope2-type2:name2;...
# 其中 scope 可以是 [required, optional, incompatible, embedded] 之一，
#       type 可以是 [project, version] 之一，
# name 是另一模组的 Modrinth 项目或版本的 slug/id。
# 示例: required-project:fplib;optional-project:gasstation;incompatible-project:gregtech
# 注意: 若 usesMixins = true，UniMixins 会自动设为必需依赖。
modrinthRelations =

# 发布到 CurseForge 需要将 CURSEFORGE_TOKEN 环境变量设置为你其中一个 CurseForge API token。
#
# 项目在 CurseForge 上的数字 ID。可以在 About Project 框中找到。
# 如果不想发布到 CurseForge，请留空。
curseForgeProjectId =

# 项目在 CurseForge 上的关系。可以用它引用 CurseForge 上的其他项目。
# 语法: type1:name1;type2:name2;...
# 其中 type 可以是 [requiredDependency, embeddedLibrary, optionalDependency, tool, incompatible] 之一，
# name 是另一模组的 CurseForge 项目 slug。
# 示例: requiredDependency:railcraft;embeddedLibrary:cofhlib;incompatible:buildcraft
# 注意: 若 usesMixins = true，UniMixins 会自动设为必需依赖。
curseForgeRelations =

# 可选参数，用于自定义生成的产物。迁移旧项目时可用它保留产物命名。
# 新项目不应使用此参数。
# customArchiveBaseName =

# 可选参数，自定义 runClient* 任务使用的默认工作目录。相对于项目目录。
# runClientWorkingDirectory = run/client

# 可选参数，自定义 runServer* 任务使用的默认工作目录。相对于项目目录。
# runServerWorkingDirectory = run/server

# 可选参数，在使用非法版本时使构建自动失败。
# 例如你只想允许 '1.1.xxx' 形式的版本时很有用。
# 该检查仅在版本是 git tag 时执行。
# 注意: 指定的字符串必须转义，例如 1\\.1\\.\\d+ 而不是 1\.1\.\d+
# versionPattern =

# 取消注释以禁止发布源代码。
# noPublishedSources = true

# 取消注释以禁用 Spotless 检查。
# 仅在与上游/其他分叉同步时取消注释以保持简单。
# 也就是说，如果没有其他活跃的分叉/上游，永远不要改这个。
# disableSpotless = true

# 取消注释以禁用 Checkstyle 检查（当前为通配符 import 检查）。
# disableCheckstyle = true

# 覆盖 IDEA 构建类型。合法值: ""（留空，不覆盖）、"idea"（强制使用原生 IDEA 构建）、"gradle"
# （强制使用委托构建）。
# 此项应设置在 $HOME/.gradle/gradle.properties 中。
# 例如添加 "systemProp.org.gradle.project.ideaOverrideBuildType=idea" 会将构建类型覆盖为原生构建。
# 警告: 如果使用此选项，它会覆盖你现有项目中的任何内容。这可能不是你想要的结果！
# 通常无需在此处取消注释，因为其他开发者不一定使用与你相同的构建类型。
# ideaOverrideBuildType = idea

# IDEA 是否在按下 Build 按钮时运行 spotless 检查。
# 此项应设置在 $HOME/.gradle/gradle.properties 中。
# ideaCheckSpotlessOnBuild = true

# 非 GTNH 属性
org.gradle.configuration-cache = true
org.gradle.parallel = true

# 禁用 GTNH 的 gitVersion 模块，使构建优先使用 RELEASE_VERSION
gtnh.modules.gitVersion = false
modVersion = 0.5.0
